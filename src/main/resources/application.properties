# ===== Nombre del microservicio =====
spring.application.name=ms-envios

# ===== Puerto =====
server.port=8091

# ===== Conexión a la base de datos (MySQL en XAMPP) =====
# createDatabaseIfNotExist=true -> si la BD no existe, la crea sola
spring.datasource.url=jdbc:mysql://localhost:3306/db_perfulandia_envios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ===== JPA / Hibernate =====
# update -> crea/actualiza las tablas según mis entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# dialecto correcto de MySQL (NO MySQL8Dialect)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# URL del MS Productos para la comunicación
ms.productos.url=http://localhost:8082
# URLs de los MS con los que se comunica Envíos
ms.pagos.url=http://localhost:8086
ms.notificaciones.url=http://localhost:8089